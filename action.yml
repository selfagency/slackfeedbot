name: "SlackFeedBot"
author: "selfagency"
description: "Push RSS feed updates to Slack via GitHub Actions"
branding:
  icon: "rss"
  color: "orange"
inputs:
  rss:
    description: "RSS feed URL"
    required: true
  feed_name:
    description: "Feed name"
    required: false
  feed_image:
    description: "Feed image URL"
    required: false
  slack_webhook:
    description: "Slack webhook URL"
    required: false
  discord_webhook:
    description: "Discord webhook URL"
    required: false
  cache_dir:
    description: "Cache folder"
    required: false
  interval:
    description: "Minutes between workflow runs"
    required: false
  show_date:
    description: "Show date in output"
    required: false
  show_link:
    description: "Show link in output"
    required: false
  show_desc:
    description: "Show description in output"
    required: false
  show_img:
    description: "Show image in output"
    required: false
  unfurl:
    description: "Unfurl links"
    required: false
runs:
  using: "node24"
  main: "dist/index.cjs"
