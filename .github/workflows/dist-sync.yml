name: Dist sync

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild bundle
        run: npm run build

      - name: Commit rebuilt bundle (self-heal for Dependabot merges that bypass the pre-commit rebundle)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet dist; then
            echo "dist is up to date; nothing to commit"
            exit 0
          fi
          git add dist
          git commit -m "chore: rebuild dist bundle for dependency changes"
          git push
