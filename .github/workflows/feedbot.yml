name: FeedBot
on:
  schedule:
    # Hourly at :23 (avoids the top-of-hour congestion band; 24 runs/day).
    # Public repo: Linux minutes are free; this stays trivial even if private.
    - cron: "23 * * * *"
  workflow_dispatch:
jobs:
  feed-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Generate cache key
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: generate-key
        with:
          script: |
            core.setOutput('cache-key', new Date().valueOf())
      - name: Retrieve cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./slackfeedbot-cache
          key: feed-cache-i-${{ steps.generate-key.outputs.cache-key }}
          restore-keys: feed-cache-i-
      - name: GitHub
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://www.githubstatus.com/history.atom"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: Tailscale
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://status.tailscale.com/feed.rss"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: Bunny
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://status.bunny.net/history.atom"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: Wasabi
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://status.wasabi.com/history.atom"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: netcup
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://www.netcup-status.de/feed/"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: RackNerd
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://status.racknerd.com/rss"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: Cloudflare
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://www.cloudflarestatus.com/history.atom"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: Fivenines
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://status.fivenines.io/feed.rss"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: 1Password
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://status.1password.com/history.atom"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
      - name: Resend
        uses: "selfagency/slackfeedbot@dev"
        with:
          rss: "https://resend-status.com/feed.rss"
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
          cache_dir: "./slackfeedbot-cache"
        continue-on-error: true
